name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      target: x86_64-unknown-linux-gnu
      artifact_name: swagsh-x86_64-unknown-linux-gnu
      archive_name: swagsh-${{ github.ref_name }}-x86_64-linux.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.target }}

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build release binary
        run: just build ${{ env.target }}

      - name: Prepare and compress binary
        run: |
          mkdir -p artifacts
          cp target/${{ env.target }}/release/swagsh artifacts/${{ env.artifact_name }}
          chmod +x artifacts/${{ env.artifact_name }}

          # Create compressed archive with clean name
          cd artifacts
          tar -czf ${{ env.archive_name }} ${{ env.artifact_name }}
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.artifact_name }}
          path: artifacts/${{ env.archive_name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download built archive
        uses: actions/download-artifact@v8
        with:
          name: swagsh-x86_64-unknown-linux-gnu
          path: artifacts

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: swagsh ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/swagsh-${{ github.ref_name }}-x86_64-linux.tar.gz
